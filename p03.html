<script>
  const VR_REMOTE_ASSET_BASE = 'https://id-preview--02427422-a3c2-4695-b3ce-e3b6828e78e6.lovable.app';
  function vrAssetUrl(path) {
    if (!path) return path;
    if (/^(https?:|blob:|data:)/.test(path)) return path;
    return path;
  }
  function applyVrAssetPaths(root = document) {
    root.querySelectorAll('[data-asset-path]').forEach((el) => {
      const path = el.getAttribute('data-asset-path');
      if (!path) return;
      const resolved = vrAssetUrl(path);
      if (el.tagName === 'SOURCE') el.setAttribute('srcset', resolved);
      else el.setAttribute('src', resolved);
    });
  }
  function handleSceneImageError(img) {
    const path = img.getAttribute('data-asset-path');
    if (window.location.protocol === 'file:' && path && img.dataset.remoteRetried !== 'true') {
      img.dataset.remoteRetried = 'true';
      img.src = vrAssetUrl(path);
      return;
    }
    img.style.display = 'none';
    const fallback = document.getElementById('bgFallback');
    if (fallback) fallback.style.display = 'block';
  }
</script>

/* ═══════════ UI click sound ═══════════ */
let sfxCtx = null;
function getCtx() {
  if (!sfxCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    sfxCtx = new Ctx();
  }
  if (sfxCtx.state === 'suspended') sfxCtx.resume();
  return sfxCtx;
}
function playClickSound() {
  if (volume === 0 || !audioUnlocked) return;
  const ctx = getCtx(); if (!ctx) return;
  const t = ctx.currentTime;
  const out = ctx.createGain(); out.gain.value = 0.16; out.connect(ctx.destination);

  const body = ctx.createOscillator(); body.type = 'sine';
  body.frequency.setValueAtTime(430, t);
  body.frequency.exponentialRampToValueAtTime(268, t + 0.07);
  const bg = ctx.createGain();
  bg.gain.setValueAtTime(0.0001, t);
  bg.gain.exponentialRampToValueAtTime(0.9, t + 0.006);
  bg.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
  body.connect(bg).connect(out);

  const ring = ctx.createOscillator(); ring.type = 'triangle';
  ring.frequency.setValueAtTime(1290, t);
  const rg = ctx.createGain();
  rg.gain.setValueAtTime(0.0001, t);
  rg.gain.exponentialRampToValueAtTime(0.28, t + 0.004);
  rg.gain.exponentialRampToValueAtTime(0.0001, t + 0.055);
  ring.connect(rg).connect(out);

  const len = Math.floor(ctx.sampleRate * 0.02);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const noise = ctx.createBufferSource(); noise.buffer = buf;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
  const ng = ctx.createGain(); ng.gain.value = 0.22;
  noise.connect(lp).connect(ng).connect(out);

  body.start(t); body.stop(t + 0.09);
  ring.start(t); ring.stop(t + 0.06);
  noise.start(t);
}
document.addEventListener('click', (e) => { if (e.target.closest('button')) playClickSound(); });

}

/* ═══════════ narration: mp3 first, speech synthesis fallback ═══════════ */
/* ===== 旁白播放（新版）=====
   1. 直接播放音檔 narration-pXX-zh.mp3 / narration-pXX-en.mp3，不再預先「測試」檔案
   2. 找不到音檔時：
      - 裝置有對應語言的電腦語音（例如 Mac、Windows）→ 暫時用電腦語音朗讀
      - 沒有（例如 Meta Quest 3）→ 顯示「旁白準備中」，網頁與 VR 裡都看得到
   3. 播放狀態改變時，通知 VR 腳邊控制列更新「旁白」按鈕圖示 */
const narrMissing = { zh:false, en:false };            // 已確認找不到音檔的語言
const NARR_MSG = {
  soon:    ['旁白準備中，敬請期待', 'Narration coming soon'],
  tts:     ['旁白音檔準備中，暫時以電腦語音朗讀', 'Narration audio coming soon, using computer voice for now'],
  blocked: ['請再按一次播放旁白', 'Please tap play again'],
};

let voices = [];
function loadVoices() { voices = window.speechSynthesis ? (speechSynthesis.getVoices() || []) : []; }
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.addEventListener('voiceschanged', loadVoices); }
/* 挑選電腦語音：中文優先台灣國語（美佳、Google 國語（臺灣）等），其次才是其他中文；
   排除 macOS 內建的趣味／角色聲音（Eddy、Flo、Grandma…），避免念起來像外國口音 */
const NOVELTY_VOICE = /eddy|flo\b|grandma|grandpa|reed|rocko|sandy|shelley|albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|junior|ralph|fred|kathy/i;
function pickVoice(prefix) {
  const norm = (v) => (v.lang || '').replace('_', '-').toLowerCase();
  const pool = voices.filter((v) => !NOVELTY_VOICE.test(v.name || ''));
  const order = prefix === 'zh' ? ['zh-tw', 'zh-hant', 'cmn-tw', 'zh-cn', 'cmn', 'zh'] : ['en-us', 'en-gb', 'en'];
  const prefer = prefix === 'zh'
    ? /mei-?jia|美佳|hsiaochen|hsiaoyu|yunjhe|yating|hanhan|zhiwei|國語|臺灣|台灣|taiwan/i
    : /google us english|samantha|aria|jenny|guy|ava|allison|daniel|karen|serena/i;
  for (const tag of order) {
    const list = pool.filter((v) => norm(v).startsWith(tag));
    if (!list.length) continue;
    return list.find((v) => prefer.test(v.name || '')) || list.find((v) => v.localService) || list[0];
  }
  return null;
}
function hasVoice(l) { loadVoices(); return 'speechSynthesis' in window && !!pickVoice(l === 'zh' ? 'zh' : 'en'); }

function notifyVR() { if (window.__vrRefreshDock) window.__vrRefreshDock(); }
function narrNotice(kind) {
  const m = NARR_MSG[kind];
  showToast(m[0], m[1]);
  if (window.__vrToast) window.__vrToast(m[0], m[1]);
}

function setNarrationUI() {
  $('narrPlay').style.display  = narrating ? 'none' : 'block';
  $('narrPause').style.display = narrating ? 'block' : 'none';
  $('narrEq').classList.toggle('hidden', !narrating);
  $('narrEq').classList.toggle('flex', narrating);
  $('txtNarration').textContent = narrating ? I18N[lang].pauseNarration : I18N[lang].playNarration;
  notifyVR();
}
function speakNow() {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(NARR_TEXT[lang]);
  u.lang = lang === 'zh' ? 'zh-TW' : 'en-US';
  const v = pickVoice(lang === 'zh' ? 'zh' : 'en'); if (v) u.voice = v;
  u.rate = 0.95;
  u.onend   = () => { narrating = false; ttsPaused = false; usingTTS = false; setNarrationUI(); };
  u.onerror = () => { narrating = false; usingTTS = false; setNarrationUI(); narrNotice('soon'); };
  speechSynthesis.speak(u);
  usingTTS = true; ttsPaused = false; narrating = true;
  setNarrationUI();
  narrNotice('tts');
}
function stopNarration() {
  narration.pause();
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  narrating = false; ttsPaused = false; usingTTS = false;
  setNarrationUI();
}
function pauseNarration() {
  if (usingTTS && 'speechSynthesis' in window) { speechSynthesis.pause(); ttsPaused = true; }
  else narration.pause();
  narrating = false; setNarrationUI();
}
/* 直接播放音檔：成功回傳 'ok'，找不到檔案回傳 'missing'，瀏覽器阻擋自動播放回傳 'blocked' */
function playNarrationFile() {
  return new Promise((resolve) => {
    let settled = false;
    const finish = (r) => { if (settled) return; settled = true; narration.removeEventListener('error', onErr); resolve(r); };
    const onErr = () => finish('missing');
    narration.addEventListener('error', onErr);
    narration.src = NARR_SRC[lang];
    narration.volume = volume;
    const p = narration.play();
    if (p && typeof p.then === 'function') {
      p.then(() => finish('ok')).catch((e) => finish(e && e.name === 'NotAllowedError' ? 'blocked' : 'missing'));
    }
    setTimeout(() => finish(narration.paused ? 'missing' : 'ok'), 8000);
  });
}
function fallbackNarration() {
  if (hasVoice(lang)) speakNow();
  else narrNotice('soon');
}
let narrBusy = false;
function toggleNarration() {
  unlockAudio();
  if (narrating) { pauseNarration(); return; }
  if (ttsPaused && 'speechSynthesis' in window) {
    speechSynthesis.resume(); ttsPaused = false; narrating = true; setNarrationUI(); return;
  }
  const sameFile = (narration.src || '').indexOf(NARR_SRC[lang].replace('./', '')) !== -1;
  if (!usingTTS && sameFile && narration.currentTime > 0 && !narration.ended) {   // 從暫停處繼續
    narration.volume = volume;
    narration.play().then(() => { narrating = true; setNarrationUI(); }).catch(() => {});
    return;
  }
  if (narrMissing[lang]) { fallbackNarration(); return; }
  if (narrBusy) return;
  narrBusy = true; usingTTS = false;
  playNarrationFile().then((r) => {
    narrBusy = false;
    if (r === 'ok') { narrating = true; setNarrationUI(); }
    else if (r === 'blocked') narrNotice('blocked');
    else { narrMissing[lang] = true; fallbackNarration(); }
  });
}
$('btnNarration').addEventListener('click', toggleNarration);

<script id="mobile-fix-3-js">
(function () {
  var html = document.documentElement;
  var isMobile = function () { return html.classList.contains('m-mobile'); };
  /* 換頁標題：「&」和後面的字不分開，避免 & 單獨留在行尾 */
  var lt = document.getElementById('loadingText');
  if (lt) {
    var bind = function () {
      var w = document.createTreeWalker(lt, NodeFilter.SHOW_TEXT), t;
      while ((t = w.nextNode())) {
        var s = t.nodeValue, o = s.replace(/\s+&\s+/g, ' & ');
        if (o !== s) t.nodeValue = o;
      }
    };
    bind();
    new MutationObserver(bind).observe(lt, { childList: true, subtree: true, characterData: true });
  }
  /* 學習成果頁：手機上背景自動緩慢左右移動（不需要拖曳） */
  var dc = document.getElementById('drag-canvas'), img = document.getElementById('bgImage'), vp = document.getElementById('viewport');
  if (document.getElementById('btnOpenCard') && dc && img && vp && typeof maxPan === 'function') {
    var origMP = maxPan, on = false;
    var fit = function () {
      if (isMobile() && img.naturalWidth) {
        var vw = vp.clientWidth, vh = vp.clientHeight, ar = img.naturalWidth / img.naturalHeight;
        var w = Math.round(Math.max(vw * 1.3, vh * ar));
        dc.style.width = w + 'px'; dc.style.left = Math.round(-(w - vw) / 2) + 'px';
        dc.style.setProperty('--mpan', Math.max(0, Math.round((w - vw) / 2) - 2) + 'px');
        html.classList.add('m-p12pan');
        maxPan = function () { return 0; };
        try { dragX = 0; } catch (e) {}
        on = true;
      } else if (on) {
        dc.style.width = ''; dc.style.left = ''; html.classList.remove('m-p12pan'); maxPan = origMP; on = false;
      } else { return; }
      if (typeof renderLayer === 'function') renderLayer();
    };
    if (img.complete) fit();
    img.addEventListener('load', function () { setTimeout(fit, 0); });
    var t = null;
    window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(fit, 150); });
    setTimeout(fit, 600); setTimeout(fit, 2000);
  }
})();
</script>

<script id="mobile-fix-4-js">
(function () {
  var html = document.documentElement;
  var isMobile = function () { return html.classList.contains('m-mobile'); };
  var t = document.getElementById('txtSceneTitle');
  if (t && t.parentElement) t.parentElement.classList.add('m-title-wrap');
  /* 3D 模型：手機上自動調整距離，讓整個模型剛好放進框內（不會太大或太小） */
  var mc = document.getElementById('model-container');
  if (mc) {
    /* 手機上的 3D 模型：停止自動旋轉，依模型實際尺寸計算鏡頭距離，讓模型填滿視窗約九成；
       直拿時依模型比例調整視窗高度，減少上下空白 */
    var frame = function (mv) {
      if (!isMobile() || !mv.getDimensions) return;
      var d = mv.getDimensions(); if (!d || !d.y) return;
      mv.removeAttribute('auto-rotate');
      var o = (mv.getAttribute('camera-orbit') || '0deg 75deg 100%').split(/\s+/);
      var th = (parseFloat(o[0]) || 0) * Math.PI / 180, ph = (parseFloat(o[1]) || 75) * Math.PI / 180;
      var wv = Math.abs(d.x * Math.cos(th)) + Math.abs(d.z * Math.sin(th));
      var dep = Math.abs(d.z * Math.cos(th)) + Math.abs(d.x * Math.sin(th));
      var hv = d.y * Math.sin(ph) + dep * Math.abs(Math.cos(ph));
      if (html.classList.contains('m-por') && !mv.querySelector('.mv-hot')) {
        var cw0 = mc.clientWidth || 300;
        var want = Math.round(Math.max(240, Math.min(Math.min(440, window.innerHeight * 0.55), cw0 * (hv / wv) * 1.2)));
        if (Math.abs(mc.clientHeight - want) > 4) mc.style.height = want + 'px';
      } else { mc.style.height = ''; }
      var cw = mv.clientWidth || mc.clientWidth, ch = mv.clientHeight || mc.clientHeight; if (!cw || !ch) return;
      var fov = 30 * Math.PI / 180, t = Math.tan(fov / 2), asp = cw / ch;
      /* 王船（有圓點的模型）：船首斜桅與繩索很細，允許稍微超出框邊，讓船身更大 */
      /* 依模型最靠近鏡頭的一面計算（避免透視讓前緣放大而被切掉），四周留約 8% 空間 */
      var boat = !!mv.querySelector('.mv-hot'), por = html.classList.contains('m-por');
      /* 直拿時畫面很窄：王船以船身為準放大，細長的船首斜桅可稍微超出框邊 */
      var k = boat ? (por ? 0.74 : 0.98) : 1.16;
      var dist = Math.max((hv * k / 2) / t, (wv * k / 2) / (t * asp)) + dep * (boat && por ? 0.2 : 0.5);
      mv.setAttribute('min-field-of-view', '10deg');
      mv.setAttribute('field-of-view', '30deg');
      mv.setAttribute('min-camera-orbit', 'auto auto ' + (dist * 0.3).toFixed(3) + 'm');
      mv.setAttribute('max-camera-orbit', 'auto auto ' + (dist * 2.5).toFixed(3) + 'm');
      mv.setAttribute('camera-orbit', (o[0] || '0deg') + ' ' + (o[1] || '75deg') + ' ' + dist.toFixed(3) + 'm');
      if (mv.jumpCameraToGoal) mv.jumpCameraToGoal();
    };
    var hook = function () {
      mc.querySelectorAll('model-viewer').forEach(function (mv) {
        if (mv.__mFrame) return; mv.__mFrame = true;
        if (isMobile()) mv.removeAttribute('auto-rotate');
        var go = function () { frame(mv); setTimeout(function () { frame(mv); }, 120); };
        mv.addEventListener('load', function () { setTimeout(go, 50); });
        if (mv.loaded) go();
      });
    };
    new MutationObserver(hook).observe(mc, { childList: true, subtree: true });
    var rt = null;
    window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { mc.querySelectorAll('model-viewer').forEach(frame); }, 150); });
    /* 王船上的圓點：點中的那一個放大發亮，並顯示名稱 */
    mc.addEventListener('click', function (e) {
      var b = e.target.closest && e.target.closest('.mv-hot'); if (!b) return;
      mc.querySelectorAll('.mv-hot.m-on').forEach(function (x) { x.classList.remove('m-on'); });
      b.classList.add('m-on');
    }, true);
  }
  /* 第 2 頁：手機上兩個操作提示框 7 秒後自動淡出，或開始拖曳時就淡出 */
  if (document.getElementById('hotspotsFloat')) {
    var tip = document.getElementById('center-tooltips');
    var hide = function () { if (isMobile() && tip) { tip.classList.remove('opacity-100'); tip.classList.add('opacity-0'); tip.style.pointerEvents = 'none'; } };
    setTimeout(hide, 7000);
    var dc = document.getElementById('drag-canvas');
    if (dc) dc.addEventListener('touchmove', hide, { passive: true });
  }
})();
</script>
<script id="bgm-tap-fix">
/* 手機背景音樂修正：手機瀏覽器只在「手指放開」時才允許播放聲音，
   原本在手指一碰到螢幕時就嘗試播放並且只試一次，所以會失敗。
   這裡改成每次點擊放開時，若音樂尚未播放、使用者也沒有按靜音，就再試一次。 */
(function () {
  var b = document.getElementById('bg-audio'); if (!b) return;
  var userMuted = false;
  var ab = document.getElementById('btnAudio');
  if (ab) ab.addEventListener('click', function () { setTimeout(function () { userMuted = b.paused; }, 120); });
  var vs = document.getElementById('volSlider');
  if (vs) vs.addEventListener('input', function () { userMuted = Number(vs.value) === 0; });
  var tryPlay = function (e) {
    if (userMuted || !b.paused) return;
    if (e && e.target && e.target.closest && e.target.closest('#btnAudio, #volPopup')) return;
    var v = 0.15; try { v = volume; } catch (_) {}
    if (!(v > 0)) return;
    b.play().then(function () { try { bgmOn = true; setAudioIcon(); } catch (_) {} }).catch(function () {});
  };
  ['pointerup', 'touchend', 'click', 'keydown'].forEach(function (t) { window.addEventListener(t, tryPlay, { capture: true }); });
})();
</script>
