<script>
  const VR_REMOTE_ASSET_BASE = 'https://id-preview--02427422-a3c2-4695-b3ce-e3b6828e78e6.lovable.app';
  function vrAssetUrl(path) {
    if (!path) return path;
    if (/^(https?:|blob:|data:)/.test(path)) return path;
    return path;
  }
  function applyVrAssetPaths(root = document) {
    root.querySelectorAll('[data-asset-path]').forEach((el) => {
      const path = el.getAttribute('data-asset-path');
      if (!path) return;
      const resolved = vrAssetUrl(path);
      if (el.tagName === 'SOURCE') el.setAttribute('srcset', resolved);
      else el.setAttribute('src', resolved);
    });
  }
  function handleSceneImageError(img) {
    const path = img.getAttribute('data-asset-path');
    if (window.location.protocol === 'file:' && path && img.dataset.remoteRetried !== 'true') {
      img.dataset.remoteRetried = 'true';
      img.src = vrAssetUrl(path);
      return;
    }
    img.style.display = 'none';
    const fallback = document.getElementById('bgFallback');
    if (fallback) fallback.style.display = 'block';
  }
</script>

<script>
const $ = (id) => document.getElementById(id);

/* ═══════════ gold line-art icons ═══════════ */
const svg = (paths, size = 24) =>

const ICONS = {

};

$('icoTips').innerHTML    = ICONS.tap;
$('icoNarr').innerHTML    = ICONS.sound;

/* ═══════════ copy ═══════════ */
const I18N = {
  zh: {
    title: '操作說明', titleEn: 'Mobile, Tablet & VR Controls',
    tipsHead: '操作提示', tipsHeadEn: 'Controls',
    narrHead: '語音導覽', narrHeadEn: 'Audio Narration',

    successHead: '測試成功', successHeadEn: 'Success',
    successBody: '太棒了！你已經學會點擊發光圓點。在接下來的導覽中，點擊這些發光圓點，就能看到每個地方的歷史與文化解說。準備好後，請點擊右下角的「下一步」按鈕。',
    successClose: '關閉',
    safe: '請坐著或站在安全、平穩的地方使用，避免邊走邊看。若感到不適，請先暫停休息。本體驗為觀察與導覽性質，不模擬任何祭祀行為。',

    audioOn: '環境音已開啟', audioOff: '環境音已關閉',
    langNote: '介面語言：中文',
    narrationTTS: '旁白音檔尚未放入資料夾，改用語音合成朗讀',
    narrationNone: '此瀏覽器不支援語音朗讀，請改用預設瀏覽器開啟',
    inApp: '建議點擊右上角 ⋯ 選用預設瀏覽器開啟，以獲得最佳音效體驗',
    entering: '前往沿海廟埕…'
  },
  en: {
    title: 'Mobile, Tablet & VR Controls', titleEn: '操作說明',
    tipsHead: 'Controls', tipsHeadEn: '操作提示',
    narrHead: 'Audio Narration', narrHeadEn: '語音導覽',
    narrBody: "Before we begin, please find a comfortable and safe spot. On a phone or tablet, swipe to look around, tap the glowing dots to view information, and use the on-screen buttons to move between scenes. With a VR headset, simply turn your head to look around, point the controller at a glowing dot and pull the trigger to view information, and look down to find the menu for changing scenes. In VR, please stay aware of the space around you, and take a break whenever you feel dizzy or uncomfortable. When you are ready, let's begin the Kaohsiung Wangye Faith Journey together!",
    successHead: 'Success', successHeadEn: '測試成功',
    successBody: "Great job! You now know how to tap the glowing dots. In the tour ahead, tap them to see the history and culture of each place. When you are ready, tap the Next button at the bottom right.",
    successClose: 'Close',
    safe: 'For your safety, please stay seated or stand in a safe, stable place. Do not walk around during the experience. If you feel unwell, please stop and rest. This experience is for observation and guided learning only. No ritual acts are simulated.',
    playNarration: 'Play', pauseNarration: 'Pause',
    start: 'Next: Observer Guide', back: 'Back to Home',
    volHead: 'Volume',
    audioOn: 'Ambient sound on', audioOff: 'Ambient sound off',
    langNote: 'Interface language: English',
    narrationTTS: 'Narration file not found. Using the computer voice instead.',
    narrationNone: 'This browser cannot play the narration. Please open this page in your default browser.',
    inApp: 'For the best audio, tap ⋯ at the top right and open in your default browser',
    entering: 'Entering the coastal temple square…'
  }
};

const HOTSPOTS = [
  { id:'look', icon:'swipe', zh:'拖曳 / 滑動觀看', en:'Drag / Swipe to Look Around',
    tipZh:'按住畫面左右拖曳，就能環顧整個廟埕。', tipEn:'Hold and drag left or right to look around the temple square.' },
  { id:'tap',  icon:'tap',   zh:'點擊發光圓點', en:'Tap Glowing Dots to View Information',
    tipZh:'請在背景畫面中，尋找並點擊發光圓點。', tipEn:'Find and tap the glowing dots in the background.' }
];

const NARR_SRC  = { zh:'./narration-p02-zh.mp3', en:'./narration-p02-en.mp3' };
const NARR_TEXT = { zh: I18N.zh.narrBody, en: I18N.en.narrBody };

/* ═══════════ state ═══════════ */
/* ── language preference, shared across every page ──────────
   Read once at startup so a student who picks EN on the entry
   page stays in EN for the whole journey. Wrapped in try/catch
   because Safari private mode throws on localStorage access. */
const LANG_KEY = 'preferred_lang';
function loadLang() {
  try {
    const saved = localStorage.getItem(LANG_KEY);
    return saved === 'en' ? 'en' : 'zh';
  } catch (e) { return 'zh'; }
}
function saveLang(v) {
  try { localStorage.setItem(LANG_KEY, v); } catch (e) {}
}

let lang = loadLang();
let bgmOn = false;
let narrating = false, ttsPaused = false, usingTTS = false;
let audioUnlocked = false;
let volume = 0.15;  /* subtle mood bed, under the narration */
let toastTimer = null;

const bgm = $('bg-audio');   /* the ambient bed */
const narration = $('narration');
applyVrAssetPaths();

/* ═══════════ UI click sound ═══════════ */
let sfxCtx = null;
function getCtx() {
  if (!sfxCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    sfxCtx = new Ctx();
  }
  if (sfxCtx.state === 'suspended') sfxCtx.resume();
  return sfxCtx;
}
function playClickSound() {
  if (volume === 0 || !audioUnlocked) return;
  const ctx = getCtx(); if (!ctx) return;
  const t = ctx.currentTime;
  const out = ctx.createGain(); out.gain.value = 0.16; out.connect(ctx.destination);

  const body = ctx.createOscillator(); body.type = 'sine';
  body.frequency.setValueAtTime(430, t);
  body.frequency.exponentialRampToValueAtTime(268, t + 0.07);
  const bg = ctx.createGain();
  bg.gain.setValueAtTime(0.0001, t);
  bg.gain.exponentialRampToValueAtTime(0.9, t + 0.006);
  bg.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
  body.connect(bg).connect(out);

  const ring = ctx.createOscillator(); ring.type = 'triangle';
  ring.frequency.setValueAtTime(1290, t);
  const rg = ctx.createGain();
  rg.gain.setValueAtTime(0.0001, t);
  rg.gain.exponentialRampToValueAtTime(0.28, t + 0.004);
  rg.gain.exponentialRampToValueAtTime(0.0001, t + 0.055);
  ring.connect(rg).connect(out);

  const len = Math.floor(ctx.sampleRate * 0.02);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const noise = ctx.createBufferSource(); noise.buffer = buf;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
  const ng = ctx.createGain(); ng.gain.value = 0.22;
  noise.connect(lp).connect(ng).connect(out);

  body.start(t); body.stop(t + 0.09);
  ring.start(t); ring.stop(t + 0.06);
  noise.start(t);
}
document.addEventListener('click', (e) => { if (e.target.closest('button')) playClickSound(); });

/* ═══════════ mobile audio unlock ═══════════ */
function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;

  if ('speechSynthesis' in window) {
    try { const w = new SpeechSynthesisUtterance(' '); w.volume = 0; speechSynthesis.speak(w); speechSynthesis.cancel(); } catch (e) {}
  }
  try { getCtx(); } catch (e) {}

  /* Browsers block autoplay with sound until a gesture, so the first tap
     starts the ambience from the already-resolved CDN URL. */
  if (bgm && volume > 0) {
    bgm.volume = volume;
    bgm.play().then(() => { bgmOn = true; setAudioIcon(); }).catch(() => {});
  }
  setAudioIcon();
}
window.addEventListener('pointerdown', unlockAudio, { once:true });
window.addEventListener('touchstart', unlockAudio, { once:true });
window.addEventListener('click', unlockAudio, { once:true });

/* ═══════════ toast ═══════════ */
/* Pass one string for text that is already in the active language, or
   (zh, en) for a bilingual message — only the active one is displayed,
   and the spans get picked up by applyLang if the user switches. */
function showToast(zhOrText, en) {
  const box = $('toastMain');
  if (en === undefined) {
    box.textContent = zhOrText;
  } else {
    box.innerHTML =
      `<span class="zh"${lang === 'zh' ? '' : ' style="display:none;"'}>${zhOrText}</span>` +
      `<span class="en"${lang === 'en' ? '' : ' style="display:none;"'}>${en}</span>`;
  }
  $('toastSub').textContent = '';
  const el = $('toast');
  el.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 2800);
}

/* ═══════════ ambient sound + volume popover ═══════════ */
function setAudioIcon() {
  const audible = bgmOn && volume > 0;
  $('iconMuted').style.display = audible ? 'none' : 'block';
  $('iconSound').style.display = audible ? 'block' : 'none';
  $('btnAudio').setAttribute('aria-pressed', String(audible));
  $('audioDot').style.display = audioUnlocked ? 'none' : 'block';
}
/* Slide the slider to 0 and the bed stops; move it up and it resumes.
   No separate on/off button — the slider IS the control. */
function applyVolume() {
  bgm.volume = volume;
  narration.volume = volume;
  $('volValue').textContent = Math.round(volume * 100) + '%';
  if (volume === 0) {
    bgm.pause();
    bgmOn = false;
  } else if (bgm.paused && audioUnlocked) {
    bgm.play().then(() => { bgmOn = true; setAudioIcon(); }).catch(() => {});
  }
  setAudioIcon();
}
function toggleVolPopup(force) {
  const el = $('volPopup');
  const show = force !== undefined ? force : el.classList.contains('hidden');
  el.classList.toggle('hidden', !show);
}
$('btnAudio').addEventListener('click', (e) => { e.stopPropagation(); unlockAudio(); toggleVolPopup(); });
$('volSlider').addEventListener('input', (e) => { unlockAudio(); volume = Number(e.target.value) / 100; applyVolume(); });
document.addEventListener('click', (e) => {
  if (!$('volPopup').classList.contains('hidden') &&
      !e.target.closest('#volPopup') && !e.target.closest('#btnAudio')) toggleVolPopup(false);
});

/* ═══════════ narration: mp3 first, speech synthesis fallback ═══════════ */
/* ===== 旁白播放（新版）=====
   1. 直接播放音檔 narration-pXX-zh.mp3 / narration-pXX-en.mp3，不再預先「測試」檔案
   2. 找不到音檔時：
      - 裝置有對應語言的電腦語音（例如 Mac、Windows）→ 暫時用電腦語音朗讀
      - 沒有（例如 Meta Quest 3）→ 顯示「旁白準備中」，網頁與 VR 裡都看得到
   3. 播放狀態改變時，通知 VR 腳邊控制列更新「旁白」按鈕圖示 */
const narrMissing = { zh:false, en:false };            // 已確認找不到音檔的語言
const NARR_MSG = {
  soon:    ['旁白準備中，敬請期待', 'Narration coming soon'],
  tts:     ['旁白音檔準備中，暫時以電腦語音朗讀', 'Narration audio coming soon, using computer voice for now'],
  blocked: ['請再按一次播放旁白', 'Please tap play again'],
};

let voices = [];
function loadVoices() { voices = window.speechSynthesis ? (speechSynthesis.getVoices() || []) : []; }
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.addEventListener('voiceschanged', loadVoices); }
/* 挑選電腦語音：中文優先台灣國語（美佳、Google 國語（臺灣）等），其次才是其他中文；
   排除 macOS 內建的趣味／角色聲音（Eddy、Flo、Grandma…），避免念起來像外國口音 */
const NOVELTY_VOICE = /eddy|flo\b|grandma|grandpa|reed|rocko|sandy|shelley|albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|junior|ralph|fred|kathy/i;
function pickVoice(prefix) {
  const norm = (v) => (v.lang || '').replace('_', '-').toLowerCase();
  const pool = voices.filter((v) => !NOVELTY_VOICE.test(v.name || ''));
  const order = prefix === 'zh' ? ['zh-tw', 'zh-hant', 'cmn-tw', 'zh-cn', 'cmn', 'zh'] : ['en-us', 'en-gb', 'en'];
  const prefer = prefix === 'zh'
    ? /mei-?jia|美佳|hsiaochen|hsiaoyu|yunjhe|yating|hanhan|zhiwei|國語|臺灣|台灣|taiwan/i
    : /google us english|samantha|aria|jenny|guy|ava|allison|daniel|karen|serena/i;
  for (const tag of order) {
    const list = pool.filter((v) => norm(v).startsWith(tag));
    if (!list.length) continue;
    return list.find((v) => prefer.test(v.name || '')) || list.find((v) => v.localService) || list[0];
  }
  return null;
}
function hasVoice(l) { loadVoices(); return 'speechSynthesis' in window && !!pickVoice(l === 'zh' ? 'zh' : 'en'); }

function notifyVR() { if (window.__vrRefreshDock) window.__vrRefreshDock(); }
function narrNotice(kind) {
  const m = NARR_MSG[kind];
  showToast(m[0], m[1]);
  if (window.__vrToast) window.__vrToast(m[0], m[1]);
}

function setNarrationUI() {
  $('narrPlay').style.display  = narrating ? 'none' : 'block';
  $('narrPause').style.display = narrating ? 'block' : 'none';
  $('narrEq').classList.toggle('hidden', !narrating);
  $('narrEq').classList.toggle('flex', narrating);
  $('txtNarration').textContent = narrating ? I18N[lang].pauseNarration : I18N[lang].playNarration;
  notifyVR();
}
function speakNow() {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(NARR_TEXT[lang]);
  u.lang = lang === 'zh' ? 'zh-TW' : 'en-US';
  const v = pickVoice(lang === 'zh' ? 'zh' : 'en'); if (v) u.voice = v;
  u.rate = 0.95;
  u.onend   = () => { narrating = false; ttsPaused = false; usingTTS = false; setNarrationUI(); };
  u.onerror = () => { narrating = false; usingTTS = false; setNarrationUI(); narrNotice('soon'); };
  speechSynthesis.speak(u);
  usingTTS = true; ttsPaused = false; narrating = true;
  setNarrationUI();
  narrNotice('tts');
}
function stopNarration() {
  narration.pause();
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  narrating = false; ttsPaused = false; usingTTS = false;
  setNarrationUI();
}
function pauseNarration() {
  if (usingTTS && 'speechSynthesis' in window) { speechSynthesis.pause(); ttsPaused = true; }
  else narration.pause();
  narrating = false; setNarrationUI();
}
/* 直接播放音檔：成功回傳 'ok'，找不到檔案回傳 'missing'，瀏覽器阻擋自動播放回傳 'blocked' */
function playNarrationFile() {
  return new Promise((resolve) => {
    let settled = false;
    const finish = (r) => { if (settled) return; settled = true; narration.removeEventListener('error', onErr); resolve(r); };
    const onErr = () => finish('missing');
    narration.addEventListener('error', onErr);
    narration.src = NARR_SRC[lang];
    narration.volume = volume;
    const p = narration.play();
    if (p && typeof p.then === 'function') {
      p.then(() => finish('ok')).catch((e) => finish(e && e.name === 'NotAllowedError' ? 'blocked' : 'missing'));
    }
    setTimeout(() => finish(narration.paused ? 'missing' : 'ok'), 8000);
  });
}
function fallbackNarration() {
  if (hasVoice(lang)) speakNow();
  else narrNotice('soon');
}
let narrBusy = false;
function toggleNarration() {
  unlockAudio();
  if (narrating) { pauseNarration(); return; }
  if (ttsPaused && 'speechSynthesis' in window) {
    speechSynthesis.resume(); ttsPaused = false; narrating = true; setNarrationUI(); return;
  }
  const sameFile = (narration.src || '').indexOf(NARR_SRC[lang].replace('./', '')) !== -1;
  if (!usingTTS && sameFile && narration.currentTime > 0 && !narration.ended) {   // 從暫停處繼續
    narration.volume = volume;
    narration.play().then(() => { narrating = true; setNarrationUI(); }).catch(() => {});
    return;
  }
  if (narrMissing[lang]) { fallbackNarration(); return; }
  if (narrBusy) return;
  narrBusy = true; usingTTS = false;
  playNarrationFile().then((r) => {
    narrBusy = false;
    if (r === 'ok') { narrating = true; setNarrationUI(); }
    else if (r === 'blocked') narrNotice('blocked');

/* ═══════════ drag to pan ═══════════ */
/* Keep real image overflow on both sides and derive the pan limit from that
   overflow. The small safety inset prevents sub-pixel gaps at either edge. */
const viewport   = $('viewport');
const dragCanvas = $('drag-canvas');
let dragX = 0, dragging = false, startX = 0, startY = 0, startDragX = 0, axisLocked = null;

function maxPan() {
  return Math.max(0, (dragCanvas.clientWidth - viewport.clientWidth) / 2 - 4);
}
function renderLayer() {
  const x = Math.max(-maxPan(), Math.min(maxPan(), dragX));
  dragX = x;
  dragCanvas.style.transform = `translate3d(${x}px,0,0)`;
}
function pointFrom(e) { const p = e.touches ? e.touches[0] : e; return { x:p.clientX, y:p.clientY }; }
function dragStart(e) {
  if (e.target.closest('button') || e.target.closest('[role="button"]')) return;
  const p = pointFrom(e);
  dragging = true; axisLocked = null;
  startX = p.x; startY = p.y; startDragX = dragX;
  dragCanvas.classList.add('grabbing');
}
function dragMove(e) {
  if (!dragging) return;
  const p = pointFrom(e);
  const dx = p.x - startX, dy = p.y - startY;
  if (e.touches && axisLocked === null) {
    if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
    axisLocked = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
  }
  if (axisLocked === 'y') return;
  if (e.cancelable && e.touches) e.preventDefault();
  dragX = startDragX + dx;
  renderLayer();
}
function dragEnd() {
  if (!dragging) return;
  dragging = false; axisLocked = null;
  dragX = Math.max(-maxPan(), Math.min(maxPan(), dragX));
  dragCanvas.classList.remove('grabbing');
}
dragCanvas.addEventListener('mousedown', dragStart);
window.addEventListener('mousemove', dragMove);
window.addEventListener('mouseup', dragEnd);
viewport.addEventListener('mouseleave', dragEnd);
dragCanvas.addEventListener('touchstart', dragStart, { passive:true });
dragCanvas.addEventListener('touchmove', dragMove, { passive:false });
dragCanvas.addEventListener('touchend', dragEnd);
dragCanvas.addEventListener('dragstart', (e) => e.preventDefault());
window.addEventListener('resize', renderLayer);

/* ═══════════ hotspot anchoring ═══════════ */
/* The background is rendered with object-cover / object-center inside a
   canvas that matches the viewport, so a plain top/left percentage drifts off
   the object as the window changes. layoutSpots() re-derives the real painted
   image box and places each dot on its exact data-px / data-py image pixel. */
function layoutSpots() {
  const img = $('bgImage');
  if (!img || !img.naturalWidth) return;
  const cw = dragCanvas.clientWidth, ch = dragCanvas.clientHeight;
  const scale = Math.max(cw / img.naturalWidth, ch / img.naturalHeight);
  const dw = img.naturalWidth * scale, dh = img.naturalHeight * scale;
  const offX = (cw - dw) / 2;      /* object-position: center horizontally */
  const offY = (ch - dh) * 0.30;   /* object-position: 30% vertically      */
  document.querySelectorAll('.spotBtn[data-px]').forEach((el) => {
    const px = parseFloat(el.dataset.px), py = parseFloat(el.dataset.py);
    el.style.left = (offX + px * dw) + 'px';
    el.style.top  = (offY + py * dh) + 'px';
    el.style.right = 'auto';
    el.style.transform = 'translate(-50%, -50%)';
  });
}
if ($('bgImage').complete) layoutSpots();
$('bgImage').addEventListener('load', layoutSpots);
window.addEventListener('resize', layoutSpots);

<script id="prefetch-assets">

<script id="audio-and-hyphen-fix">
/* 1. 旁白固定以最大音量播放；播放旁白時，背景音樂自動降到原本的 35%，旁白結束後恢復。
      音量滑桿只調整背景音樂。
   2. 英文段落左右對齊時，替很長的專有名詞加上「可斷行位置」，避免行內出現大空隙。 */
(function () {
  var n = document.getElementById('narration');
  var b = document.getElementById('bg-audio');
  var P = Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, 'volume');
  if (n && b && P) {
    var DUCK = 0.35, ducked = false, want = P.get.call(b);
    var applyBg = function () { P.set.call(b, Math.min(1, want * (ducked ? DUCK : 1))); };
    Object.defineProperty(b, 'volume', { configurable: true,
      get: function () { return want; },
      set: function (v) { want = v; applyBg(); } });
    Object.defineProperty(n, 'volume', { configurable: true,
      get: function () { return P.get.call(n); },
      set: function () { P.set.call(n, 1); } });
    P.set.call(n, 1);
    var duck = function () { ducked = true; applyBg(); };
    var undo = function () { ducked = false; applyBg(); };
    n.addEventListener('play', duck);
    n.addEventListener('pause', undo);
    n.addEventListener('ended', undo);
  }

  var SHY = '­';
  var MAP = [
    [/Guanjiangshou/g, 'Guan' + SHY + 'jiang' + SHY + 'shou'],
    [/Kaohsiung/g, 'Kaoh' + SHY + 'siung'],
    [/Wangye/g, 'Wang' + SHY + 'ye'],
    [/Daitian/g, 'Dai' + SHY + 'tian'],
    [/palanquin/g, 'pal' + SHY + 'an' + SHY + 'quin'],
    [/Congratulations/g, 'Con' + SHY + 'grat' + SHY + 'u' + SHY + 'la' + SHY + 'tions'],
    [/craftspeople/g, 'crafts' + SHY + 'peo' + SHY + 'ple'],
    [/craftsmanship/g, 'crafts' + SHY + 'man' + SHY + 'ship'],
    [/woodworking/g, 'wood' + SHY + 'work' + SHY + 'ing'],
    [/procession/g, 'pro' + SHY + 'ces' + SHY + 'sion'],
    [/participation/g, 'par' + SHY + 'tic' + SHY + 'i' + SHY + 'pa' + SHY + 'tion'],
    [/performers/g, 'per' + SHY + 'form' + SHY + 'ers']
  ];
  var fixNode = function (root) {
    var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), t;
    while ((t = w.nextNode())) {
      var s = t.nodeValue, o = s;
      if (!/[A-Za-z]{7}/.test(s)) continue;
      for (var i = 0; i < MAP.length; i++) o = o.replace(MAP[i][0], MAP[i][1]);
      if (o !== s) t.nodeValue = o;
    }
  };
  var queued = false;
  var run = function () {
    queued = false;
    document.querySelectorAll('.panel-body, #modalAbout p.en').forEach(fixNode);
  };
  new MutationObserver(function () {
    if (!queued) { queued = true; requestAnimationFrame(run); }
  }).observe(document.body, { childList: true, subtree: true, characterData: true });
  run();
})();
</script>

  var t = document.getElementById('txtSceneTitle');
  if (t && t.parentElement) t.parentElement.classList.add('m-title-wrap');
  /* 3D 模型：手機上自動調整距離，讓整個模型剛好放進框內（不會太大或太小） */
  var mc = document.getElementById('model-container');
  if (mc) {
    /* 手機上的 3D 模型：停止自動旋轉，依模型實際尺寸計算鏡頭距離，讓模型填滿視窗約九成；
       直拿時依模型比例調整視窗高度，減少上下空白 */
    var frame = function (mv) {
      if (!isMobile() || !mv.getDimensions) return;
      var d = mv.getDimensions(); if (!d || !d.y) return;
      mv.removeAttribute('auto-rotate');
      var o = (mv.getAttribute('camera-orbit') || '0deg 75deg 100%').split(/\s+/);
      var th = (parseFloat(o[0]) || 0) * Math.PI / 180, ph = (parseFloat(o[1]) || 75) * Math.PI / 180;
      var wv = Math.abs(d.x * Math.cos(th)) + Math.abs(d.z * Math.sin(th));
      var dep = Math.abs(d.z * Math.cos(th)) + Math.abs(d.x * Math.sin(th));
      var hv = d.y * Math.sin(ph) + dep * Math.abs(Math.cos(ph));
      if (html.classList.contains('m-por') && !mv.querySelector('.mv-hot')) {
        var cw0 = mc.clientWidth || 300;
        var want = Math.round(Math.max(240, Math.min(Math.min(440, window.innerHeight * 0.55), cw0 * (hv / wv) * 1.2)));
        if (Math.abs(mc.clientHeight - want) > 4) mc.style.height = want + 'px';
      } else { mc.style.height = ''; }
      var cw = mv.clientWidth || mc.clientWidth, ch = mv.clientHeight || mc.clientHeight; if (!cw || !ch) return;
      var fov = 30 * Math.PI / 180, t = Math.tan(fov / 2), asp = cw / ch;
      /* 王船（有圓點的模型）：船首斜桅與繩索很細，允許稍微超出框邊，讓船身更大 */
      /* 依模型最靠近鏡頭的一面計算（避免透視讓前緣放大而被切掉），四周留約 8% 空間 */
      var boat = !!mv.querySelector('.mv-hot'), por = html.classList.contains('m-por');
      /* 直拿時畫面很窄：王船以船身為準放大，細長的船首斜桅可稍微超出框邊 */
      var k = boat ? (por ? 0.74 : 0.98) : 1.16;
      var dist = Math.max((hv * k / 2) / t, (wv * k / 2) / (t * asp)) + dep * (boat && por ? 0.2 : 0.5);
      mv.setAttribute('min-field-of-view', '10deg');
      mv.setAttribute('field-of-view', '30deg');
      mv.setAttribute('min-camera-orbit', 'auto auto ' + (dist * 0.3).toFixed(3) + 'm');
      mv.setAttribute('max-camera-orbit', 'auto auto ' + (dist * 2.5).toFixed(3) + 'm');
      mv.setAttribute('camera-orbit', (o[0] || '0deg') + ' ' + (o[1] || '75deg') + ' ' + dist.toFixed(3) + 'm');
      if (mv.jumpCameraToGoal) mv.jumpCameraToGoal();
    };
    var hook = function () {
      mc.querySelectorAll('model-viewer').forEach(function (mv) {
        if (mv.__mFrame) return; mv.__mFrame = true;
        if (isMobile()) mv.removeAttribute('auto-rotate');
        var go = function () { frame(mv); setTimeout(function () { frame(mv); }, 120); };
        mv.addEventListener('load', function () { setTimeout(go, 50); });
        if (mv.loaded) go();
      });
    };
    new MutationObserver(hook).observe(mc, { childList: true, subtree: true });
    var rt = null;
    window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { mc.querySelectorAll('model-viewer').forEach(frame); }, 150); });
    /* 王船上的圓點：點中的那一個放大發亮，並顯示名稱 */
    mc.addEventListener('click', function (e) {
      var b = e.target.closest && e.target.closest('.mv-hot'); if (!b) return;
      mc.querySelectorAll('.mv-hot.m-on').forEach(function (x) { x.classList.remove('m-on'); });
      b.classList.add('m-on');
    }, true);
  }
  /* 第 2 頁：手機上兩個操作提示框 7 秒後自動淡出，或開始拖曳時就淡出 */
  if (document.getElementById('hotspotsFloat')) {
    var tip = document.getElementById('center-tooltips');
    var hide = function () { if (isMobile() && tip) { tip.classList.remove('opacity-100'); tip.classList.add('opacity-0'); tip.style.pointerEvents = 'none'; } };
    setTimeout(hide, 7000);
    var dc = document.getElementById('drag-canvas');
    if (dc) dc.addEventListener('touchmove', hide, { passive: true });
  }
})();
</script>
<script id="bgm-tap-fix">
/* 手機背景音樂修正：手機瀏覽器只在「手指放開」時才允許播放聲音，
   原本在手指一碰到螢幕時就嘗試播放並且只試一次，所以會失敗。
   這裡改成每次點擊放開時，若音樂尚未播放、使用者也沒有按靜音，就再試一次。 */
(function () {
  var b = document.getElementById('bg-audio'); if (!b) return;
  var userMuted = false;
  var ab = document.getElementById('btnAudio');
  if (ab) ab.addEventListener('click', function () { setTimeout(function () { userMuted = b.paused; }, 120); });
  var vs = document.getElementById('volSlider');
  if (vs) vs.addEventListener('input', function () { userMuted = Number(vs.value) === 0; });
  var tryPlay = function (e) {
    if (userMuted || !b.paused) return;
    if (e && e.target && e.target.closest && e.target.closest('#btnAudio, #volPopup')) return;
    var v = 0.15; try { v = volume; } catch (_) {}
    if (!(v > 0)) return;
    b.play().then(function () { try { bgmOn = true; setAudioIcon(); } catch (_) {} }).catch(function () {});
  };
  ['pointerup', 'touchend', 'click', 'keydown'].forEach(function (t) { window.addEventListener(t, tryPlay, { capture: true }); });
})();
</script>
